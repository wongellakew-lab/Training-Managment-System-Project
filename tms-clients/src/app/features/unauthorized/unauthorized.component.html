<div class="unauthorized-container">
  <mat-card class="unauthorized-card glass-panel">
    <div class="lock-icon-box">
      <mat-icon>lock</mat-icon>
    </div>
    <h1 class="unauthorized-title">Access Restricted</h1>
    <p class="unauthorized-desc">
      You do not have the required permissions or role to view this portal resource. Please sign in with an authorized account.
    </p>
    <div class="unauthorized-actions">
      <a mat-flat-button color="primary" routerLink="/login" class="signin-btn">
        <span>Sign In to Portal</span>
      </a>
    </div>
  </mat-card>
</div>
