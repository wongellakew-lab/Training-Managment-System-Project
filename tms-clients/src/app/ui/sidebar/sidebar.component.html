<aside class="eduva-sidebar">
  <!-- Brand Logo Header -->
  <div class="sidebar-brand">
    <div class="brand-logo-icon">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="14" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-dasharray="60 30" />
        <path d="M11 16C11 13.2386 13.2386 11 16 11C18.7614 11 21 13.2386 21 16C21 18.7614 18.7614 21 16 21" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="16" cy="16" r="3" fill="#0284C7" />
      </svg>
    </div>
    <span class="brand-title">TMS<span class="brand-accent">Pro</span></span>
  </div>

  <!-- User Mini Profile -->
  <div class="sidebar-user-card">
    <div class="user-avatar">{{ getUserInitials() }}</div>
    <div class="user-info">
      <span class="user-name">{{ getUserName() }}</span>
      <span class="user-role-badge" [class]="'role-' + (userRole() | lowercase)">{{ userRole() }}</span>
    </div>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav" aria-label="Main navigation">
    <ul class="nav-list">
      @for (item of navItems(); track item.path) {
        <li class="nav-item">
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="nav-link"
            [attr.aria-label]="item.label"
          >
            <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Bottom Actions -->
  <div class="sidebar-footer-section">
    <!-- Upgrade Card -->
    <div class="upgrade-card">
      <div class="upgrade-illustration">
        <span class="avatar-emoji">🌍</span>
        <span class="avatar-pencil">✏️</span>
        <div class="avatar-book">📚</div>
      </div>
      <h4 class="upgrade-title">Upgrade to Pro</h4>
      <p class="upgrade-desc">Unlock analytics, premium courses, and collaboration tools.</p>
      <button class="upgrade-btn" type="button">Upgrade Now</button>
    </div>

    <!-- Sign Out Action -->
    <button class="signout-btn" (click)="logout()" type="button" id="sidebar-signout-btn">
      <mat-icon>logout</mat-icon>
      <span>Sign out</span>
    </button>
  </div>
</aside>
