<aside class="eduva-sidebar">
  <!-- Brand Logo Header -->
  <div class="sidebar-brand">
    <div class="brand-logo-icon">
      <svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="TMS Logo">
        <rect width="64" height="64" rx="14" fill="#172b4d"/>
        <rect x="18" y="14" width="28" height="7" rx="2" fill="#ffffff"/>
        <rect x="28" y="14" width="8" height="32" rx="2" fill="#ffffff"/>
        <rect x="19" y="50" width="26" height="4" rx="2" fill="url(#sidebarGrad)"/>
        <defs>
          <linearGradient id="sidebarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#06b6d4"/>
            <stop offset="100%" stop-color="#0284c7"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <span class="brand-title">TMS</span>
  </div>

  <!-- User Mini Profile -->
  <div class="sidebar-user-card">
    <div class="user-avatar">{{ getUserInitials() }}</div>
    <div class="user-info">
      <span class="user-name">{{ getUserName() }}</span>
      <span class="user-role-badge" [class]="'role-' + (userRole() | lowercase)">{{ userRole() }}</span>
    </div>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav" aria-label="Main navigation">
    <ul class="nav-list">
      @for (item of navItems(); track item.path) {
        <li class="nav-item">
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="nav-link"
            [attr.aria-label]="item.label"
          >
            <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Bottom Actions -->
  <div class="sidebar-footer-section">
    <!-- Sign Out Action -->
    <button class="signout-btn" (click)="logout()" type="button" id="sidebar-signout-btn">
      <mat-icon>logout</mat-icon>
      <span>Sign out</span>
    </button>
  </div>
</aside>
